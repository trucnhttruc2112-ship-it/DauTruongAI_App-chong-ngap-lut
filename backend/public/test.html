<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloodLens – Kiểm thử NV3</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 800px; margin: 32px auto; padding: 0 20px; color: #182b36; }
    button, input { font: inherit; margin: 10px 0; }
    button { padding: 8px 18px; cursor: pointer; }
    img { max-width: 100%; max-height: 360px; display: block; margin: 12px 0; }
    img[hidden] { display: none; }
    pre { background: #f1f5f8; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #notice { padding: 10px; background: #fff3cd; }
  </style>
</head>
<body>
  <h1>FloodLens – Kiểm thử NV3</h1>
  <p>Ảnh JPEG, PNG hoặc WebP tĩnh, tối đa 5 MB. Kết quả AI luôn cần xác minh thực địa.</p>
  <p id="notice" role="status">Đang kiểm tra cấu hình backend…</p>
  <form id="form">
    <label for="image">Chọn ảnh đường phố</label><br>
    <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
    <img id="preview" alt="Ảnh đã chọn để phân tích" hidden>
    <button id="submit" type="submit">Phân tích ảnh</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <pre id="result" aria-label="Kết quả JSON"></pre>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('image');
    const preview = document.getElementById('preview');
    const button = document.getElementById('submit');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    let previewUrl;
    input.addEventListener('change', () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      preview.hidden = true;
      preview.removeAttribute('src');
      result.textContent = '';
      status.textContent = '';
      const file = input.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        status.textContent = 'Ảnh vượt giới hạn 5 MB.';
        input.value = '';
        return;
      }
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.hidden = false;
    });
    preview.addEventListener('error', () => {
      preview.hidden = true;
      status.textContent = 'Không thể xem trước ảnh. Backend sẽ kiểm tra nội dung khi gửi.';
    });
    fetch('/api/health').then(response => response.json()).then(health => {
      document.getElementById('notice').textContent = health.mode === 'mock'
        ? 'MOCK: chỉ kiểm thử HTTP. Không gọi Gemini, không phân tích nội dung ảnh.'
        : health.gemini.configured
          ? 'Chế độ Gemini. Khi bấm phân tích, ảnh sẽ được gửi đến Gemini API.'
          : 'Chưa cấu hình GEMINI_API_KEY. Endpoint phân tích sẽ trả lỗi 503.';
    }).catch(() => {
      document.getElementById('notice').textContent = 'Không đọc được trạng thái backend.';
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = input.files[0];
      if (!file) return;
      const body = new FormData();
      body.append('image', file);
      button.disabled = true;
      input.disabled = true;
      form.setAttribute('aria-busy', 'true');
      status.textContent = 'Đang phân tích…';
      result.textContent = '';
      try {
        // Let the browser set Content-Type and the multipart boundary.
        const response = await fetch('/api/analyze-flood', { method: 'POST', body });
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
        status.textContent = response.ok
          ? (data.mode === 'mock' ? 'Hoàn tất kiểm thử mock; chưa phân tích AI.' : 'Đã phân tích; cần xác minh thực địa.')
          : 'Lỗi ' + response.status + ': ' + (data.error?.message || 'Không thể phân tích.');
      } catch {
        status.textContent = 'Không kết nối được backend hoặc phản hồi không hợp lệ.';
      } finally {
        button.disabled = false;
        input.disabled = false;
        form.removeAttribute('aria-busy');
      }
    });
  </script>
</body>
</html>
