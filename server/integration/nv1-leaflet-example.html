<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NV1 Example - Tích hợp Bản đồ Leaflet (Dành cho NV1 tham khảo)</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- NV4 Style cho Widget Xác nhận -->
  <link rel="stylesheet" href="/nv4/nv4.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .map-header {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .nv1-popup-card {
      min-width: 240px;
      max-width: 300px;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .nv1-popup-img {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 6px;
    }
    .nv1-popup-field {
      margin-top: 4px;
    }
    .nv1-confirm-container {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div class="map-header">
    Bản đồ Ngập lụt Đồng Nai (Mẫu tham khảo NV1) - Tự động cập nhật mỗi 30s
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script type="module">
    import { ConfirmWidget } from '/nv4/confirmWidget.js';

    // 1. Khởi tạo bản đồ trung tâm TP. Biên Hòa, Đồng Nai
    const map = L.map('map').setView([10.9574, 106.8427], 13);

    // 2. Thêm lớp bản đồ nền OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors | Hệ thống cảnh báo ngập Đồng Nai (NV4)'
    }).addTo(map);

    // 3. Hai lớp bật/tắt: "Đang ngập" (current) và "Hay ngập" (prone)
    const currentLayer = L.layerGroup().addTo(map);
    const proneLayer = L.layerGroup().addTo(map);

    L.control.layers(null, {
      '🌊 Đang ngập': currentLayer,
      '🟣 Tuyến đường hay ngập': proneLayer
    }, { collapsed: false }).addTo(map);

    // Bảng màu cho marker theo mức độ
    const COLOR_MAP = {
      red: '#e53935',
      orange: '#fb8c00',
      yellow: '#fdd835',
      gray: '#757575'
    };

    /**
     * Tải và vẽ dữ liệu GeoJSON lên bản đồ
     */
    async function fetchAndRenderFloodPoints() {
      try {
        const res = await fetch('/api/flood-points.geojson');
        if (!res.ok) {
          console.error('Lỗi khi tải GeoJSON:', res.statusText);
          return;
        }

        const geojsonData = await res.json();
        currentLayer.clearLayers();
        proneLayer.clearLayers();

        if (!geojsonData.features || !Array.isArray(geojsonData.features)) {
          return;
        }

        geojsonData.features.forEach((feature) => {
          // =========================================================================
          // LƯU Ý KỸ THUẬT QUAN TRỌNG (Rule 14):
          // - Chuẩn GeoJSON lưu tọa độ theo thứ tự: [kinh độ (lng), vĩ độ (lat)]
          // - Leaflet L.circleMarker nhận tọa độ theo thứ tự: [vĩ độ (lat), kinh độ (lng)]
          // =========================================================================
          const [lng, lat] = feature.geometry.coordinates;
          const props = feature.properties || {};

          // Quy tắc màu và viền:
          // - Viền tím đậm (#7b1fa2) nếu là điểm hay ngập (isFloodProne = true)
          // - Màu nền theo markerColor được tính sẵn từ backend NV4
          const isProne = Boolean(props.isFloodProne);
          const fillColor = COLOR_MAP[props.markerColor] || '#fb8c00';
          const strokeColor = isProne ? '#7b1fa2' : '#ffffff';
          const strokeWidth = isProne ? 3 : 1.5;

          const marker = L.circleMarker([lat, lng], {
            radius: 10,
            fillColor: fillColor,
            color: strokeColor,
            weight: strokeWidth,
            opacity: 1,
            fillOpacity: 0.85
          });

          // Gắn Popup an toàn bằng DOM API (textContent - Chống XSS)
          marker.bindPopup(() => {
            const container = document.createElement('div');
            container.className = 'nv1-popup-card';

            const title = document.createElement('strong');
            title.textContent = props.address || props.street || 'Điểm ngập tại Đồng Nai';
            container.appendChild(title);

            const severityP = document.createElement('div');
            severityP.className = 'nv1-popup-field';
            severityP.textContent = `Mức độ: ${props.severity || 'Trung bình'}`;
            container.appendChild(severityP);

            const eventCountP = document.createElement('div');
            eventCountP.className = 'nv1-popup-field';
            eventCountP.textContent = `Số lần ngập lịch sử: ${props.floodEventCount || 0} lần`;
            container.appendChild(eventCountP);

            if (props.ageMinutes !== undefined) {
              const ageP = document.createElement('div');
              ageP.className = 'nv1-popup-field';
              ageP.textContent = `Cập nhật: ${props.ageMinutes} phút trước`;
              container.appendChild(ageP);
            }

            // Ảnh hiện trường (nếu có)
            if (props.thumbnailUrl) {
              const img = document.createElement('img');
              img.className = 'nv1-popup-img';
              img.src = props.thumbnailUrl;
              img.alt = 'Ảnh hiện trường ngập nước';
              container.appendChild(img);
            }

            // Container nhúng ConfirmWidget
            const confirmBox = document.createElement('div');
            confirmBox.className = 'nv1-confirm-container';
            container.appendChild(confirmBox);

            // Khởi tạo ConfirmWidget ngay trong popup
            setTimeout(() => {
              new ConfirmWidget({
                apiBase: '',
                floodPointId: props.id,
                initialStill: props.confirmStill || 0,
                initialEnded: props.confirmEnded || 0,
                mount: confirmBox,
                onConfirmed: () => {
                  // Cập nhật lại bản đồ sau khi xác nhận
                  fetchAndRenderFloodPoints();
                }
              });
            }, 0);

            return container;
          });

          // Phân loại vào layer thích hợp
          if (props.layer === 'prone') {
            proneLayer.addLayer(marker);
          } else {
            currentLayer.addLayer(marker);
          }
        });
      } catch (err) {
        console.error('Lỗi khi fetch dữ liệu bản đồ:', err);
      }
    }

    // Tải dữ liệu lần đầu
    fetchAndRenderFloodPoints();

    // Tự động làm mới mỗi 30 giây
    setInterval(fetchAndRenderFloodPoints, 30000);
  </script>
</body>
</html>
